# kitty's colours, taken from the wallpaper.
#
# Written by handaan-theme-render from $HANDAAN_PATH/default/theme/templates/kitty.conf
# on every wallpaper change -- edit the template, not this file. Put
#
#   include ~/.local/state/handaan/theme/kitty.conf
#
# in your kitty.conf; a colour you set after that line wins over this one.

foreground              #{{text}}
background              #{{background}}
selection_foreground    #{{background}}
selection_background    #{{accent}}

cursor                  #{{accent}}
cursor_text_color       #{{background}}

url_color               #{{accentAlt}}

active_border_color     #{{accent}}
inactive_border_color   #{{border}}
bell_border_color       #{{warning}}

tab_bar_background      #{{backgroundDeep}}
active_tab_foreground   #{{background}}
active_tab_background   #{{accent}}
inactive_tab_foreground #{{textMuted}}
inactive_tab_background #{{surface}}

mark1_foreground        #{{background}}
mark1_background        #{{accent}}
mark2_foreground        #{{background}}
mark2_background        #{{accentAlt}}
mark3_foreground        #{{background}}
mark3_background        #{{warning}}

# The terminal's sixteen. Bright hues are the normal ones, as Catppuccin's are;
# see default/theme/palette.jq.
color0  #{{ansiBlack}}
color8  #{{ansiBrightBlack}}
color1  #{{ansiRed}}
color9  #{{ansiRed}}
color2  #{{ansiGreen}}
color10 #{{ansiGreen}}
color3  #{{ansiYellow}}
color11 #{{ansiYellow}}
color4  #{{ansiBlue}}
color12 #{{ansiBlue}}
color5  #{{ansiMagenta}}
color13 #{{ansiMagenta}}
color6  #{{ansiCyan}}
color14 #{{ansiCyan}}
color7  #{{ansiWhite}}
color15 #{{ansiBrightWhite}}
